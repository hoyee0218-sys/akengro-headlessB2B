<!-- @dsCard group="Spacing" viewport="700x150" name="Radius" subtitle="Small & precise — borders over rounding" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-base); }
  .row { display: flex; gap: var(--space-4); }
  .cell { text-align: center; }
  .box { width: 72px; height: 56px; background: var(--surface-sunken); border: 1px solid var(--border-strong); }
  .lab { font-family: var(--font-mono); font-size: var(--scale-2xs); color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lab">xs · 2</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab">sm · 4</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab">md · 6</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab">lg · 10</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab">xl · 14</div></div>
    <div class="cell"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="lab">pill</div></div>
  </div>
</body>
</html>
