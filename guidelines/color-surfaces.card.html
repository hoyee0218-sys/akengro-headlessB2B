<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--surface-sunken); }
  .row { display: flex; gap: var(--space-3); align-items: stretch; }
  .box { flex: 1; height: 84px; border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 10px; font: var(--text-label); color: var(--text-secondary); }
  .b-base { background: var(--surface-base); border: 1px solid var(--border-subtle); }
  .b-raised { background: var(--surface-raised); box-shadow: var(--shadow-md); }
  .b-sunken { background: var(--surface-sunken); border: 1px solid var(--border-subtle); }
  .b-strong { background: var(--surface-base); border: 1px solid var(--border-strong); }
</style>
</head>
<body>
  <div class="row">
    <div class="box b-base">surface-base</div>
    <div class="box b-raised">surface-raised + shadow-md</div>
    <div class="box b-sunken">surface-sunken</div>
    <div class="box b-strong">border-strong</div>
  </div>
</body>
</html>
