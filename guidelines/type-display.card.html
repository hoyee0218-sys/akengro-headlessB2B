<!-- @dsCard group="Type" viewport="700x230" name="Display — Archivo" subtitle="Headings; tight tracking, heavy weights" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-base); }
  .stack { display: flex; flex-direction: column; gap: var(--space-3); }
  .line { display: flex; align-items: baseline; gap: var(--space-4); }
  .spec { font-family: var(--font-display); color: var(--text-primary); letter-spacing: var(--tracking-tight); line-height: var(--leading-tight); }
  .meta { font-family: var(--font-mono); font-size: var(--scale-2xs); color: var(--text-muted); white-space: nowrap; }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="spec" style="font-size:var(--scale-4xl);font-weight:800">Wholesale, simplified</span><span class="meta">4xl · 800</span></div>
    <div class="line"><span class="spec" style="font-size:var(--scale-2xl);font-weight:700">Order by SKU, fast</span><span class="meta">2xl · 700</span></div>
    <div class="line"><span class="spec" style="font-size:var(--scale-xl);font-weight:600">Net-30 invoicing</span><span class="meta">xl · 600</span></div>
  </div>
</body>
</html>
