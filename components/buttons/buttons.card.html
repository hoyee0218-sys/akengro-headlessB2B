<!-- @dsCard group="Components" viewport="700x280" name="Buttons" subtitle="Button + IconButton — variants, sizes, states" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-base); font-family: var(--font-body); }
  .grid { display: flex; flex-direction: column; gap: var(--space-4); }
  .row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .cap { font: var(--text-label); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--text-muted); width: 72px; }
  svg.lucide { width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton } = window.HeadlessB2BStorefrontDesignSystem_4ebfb1;
  const I = ({ n }) => { const r = React.useRef(); React.useEffect(()=>{ if(r.current){ r.current.innerHTML=''; const e=document.createElement('i'); e.setAttribute('data-lucide',n); r.current.appendChild(e); window.lucide.createIcons({attrs:{class:'lucide'}}); } },[n]); return <span ref={r} style={{display:'inline-flex'}}/>; };

  function Demo() {
    return (
      <div className="grid">
        <div className="row">
          <span className="cap">Variant</span>
          <Button variant="primary">Legg i kurv</Button>
          <Button variant="secondary">Be om tilbud</Button>
          <Button variant="ghost">Avbryt</Button>
          <Button variant="accent">Mine sider</Button>
          <Button variant="danger">Slett</Button>
        </div>
        <div className="row">
          <span className="cap">Size</span>
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
        </div>
        <div className="row">
          <span className="cap">State</span>
          <Button iconStart={<I n="plus"/>}>Ny ordre</Button>
          <Button iconEnd={<I n="arrow-right"/>} variant="secondary">Til kassen</Button>
          <Button loading>Sender</Button>
          <Button disabled>Disabled</Button>
        </div>
        <div className="row">
          <span className="cap">Icon</span>
          <IconButton label="Søk"><I n="search"/></IconButton>
          <IconButton variant="outlined" label="Filtre"><I n="sliders-horizontal"/></IconButton>
          <IconButton label="Handlekurv" badge={3}><I n="shopping-cart"/></IconButton>
          <IconButton variant="solid" label="Konto"><I n="user"/></IconButton>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
