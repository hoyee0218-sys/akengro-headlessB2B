<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--surface-base); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); max-width: 640px; }
  .col { display: flex; flex-direction: column; gap: var(--space-4); }
  .stack { display: flex; flex-direction: column; gap: var(--space-3); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Select, Checkbox, Switch } = window.HeadlessB2BStorefrontDesignSystem_4ebfb1;
  function Demo() {
    return (
      <div className="grid">
        <div className="col">
          <Input label="E-post" type="email" required placeholder="navn@bedrift.no" />
          <Input label="Antall" mono suffix="stk" defaultValue="12" />
          <Input label="Passord" type="password" error="Feil passord" defaultValue="hemmelig" />
          <Select placeholder="Sorter etter" options={['Relevans','Pris lav–høy','Pris høy–lav']} />
        </div>
        <div className="col">
          <div className="stack">
            <Checkbox label="På lager" defaultChecked />
            <Checkbox label="Vis priser eks. mva" description="Standard for bedriftskunder" />
            <Checkbox indeterminate label="Alle kategorier" />
          </div>
          <div className="stack">
            <Checkbox type="radio" name="ship" label="Hent selv" defaultChecked />
            <Checkbox type="radio" name="ship" label="Levering" />
          </div>
          <Switch label="E-postvarsler" defaultChecked />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
