<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nordvik Industri — Storefront (demo)</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../_ds-preview-shim.js"></script>
<script src="data.js"></script>
<script src="../account/data-b2b.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--surface-base); }
  #app { min-height: 100%; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/babel" src="parts.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
  function App() {
    const [route, setRoute] = React.useState(location.hash === '#checkout' ? 'checkout' : 'home');
    const [pid, setPid] = React.useState(null);
    const [loggedIn, setLoggedIn] = React.useState(true);
    const [cart, setCart] = React.useState(3);

    const go = (r) => {
      if (r === 'account') { window.location.href = '../account/index.html'; return; }
      if (location.hash) history.replaceState(null, '', location.pathname);
      setRoute(r); window.scrollTo(0, 0);
    };
    const openProduct = (id) => { setPid(id); setRoute('pdp'); window.scrollTo(0, 0); };
    const addToCart = () => setCart(c => c + 1);

    return (
      <React.Fragment>
        <Header route={route} go={go} loggedIn={loggedIn} setLoggedIn={setLoggedIn} cartCount={cart} />
        {route === 'home' && <Home go={go} openProduct={openProduct} loggedIn={loggedIn} />}
        {route === 'plp' && <PLP go={go} openProduct={openProduct} loggedIn={loggedIn} />}
        {route === 'pdp' && <PDP id={pid} go={go} loggedIn={loggedIn} addToCart={addToCart} />}
        {route === 'checkout' && <Checkout go={go} loggedIn={loggedIn} />}
      </React.Fragment>
    );
  }
  window.dsReady.then(() => {
    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  });
</script>
</body>
</html>
