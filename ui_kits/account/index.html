<!-- @dsCard group="Account" viewport="1280x860" name="My Pages (Mine sider)" subtitle="Dashboard · Quick order · Lists · Orders · Quotes · Users · Notifications" -->
<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mine sider — B2B-konto (demo)</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../_ds-preview-shim.js"></script>
<script src="../storefront/data.js"></script>
<script src="data-b2b.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--surface-sunken); }
  #app { min-height: 100%; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/babel" src="parts.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens-b2b.jsx"></script>
<script type="text/babel">
  function App() {
    const [section, setSection] = React.useState('dashboard');
    const [oid, setOid] = React.useState(null);
    const [qid, setQid] = React.useState(null);
    const go = (s) => {
      if (s === 'checkout') { window.location.href = '../storefront/index.html#checkout'; return; }
      setSection(s); window.scrollTo(0, 0);
    };
    const openOrder = (id) => { setOid(id); setSection('orderDetail'); window.scrollTo(0, 0); };
    const openQuote = (id) => { setQid(id); setSection('quoteDetail'); window.scrollTo(0, 0); };
    return (
      <main className="ac">
        <Sidebar section={section} go={go} />
        <div className="ac-main">
          {section === 'dashboard' && <Dashboard go={go} openOrder={openOrder} />}
          {section === 'quickorder' && <QuickOrder go={go} />}
          {section === 'lists' && <SavedLists go={go} />}
          {section === 'orders' && <Orders openOrder={openOrder} />}
          {section === 'orderDetail' && <OrderDetail id={oid} go={go} />}
          {section === 'quotes' && <Quotes go={go} openQuote={openQuote} />}
          {section === 'quoteDetail' && <QuoteDetail id={qid} go={go} />}
          {section === 'pricelist' && <PriceList />}
          {section === 'credit' && <Credit />}
          {section === 'users' && <Users />}
          {section === 'notifications' && <Notifications />}
        </div>
      </main>
    );
  }
  window.dsReady.then(() => {
    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  });
</script>
</body>
</html>
